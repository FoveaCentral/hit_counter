name: Score
on:
  push:
permissions: read-all
jobs:
  Scorecard:
    if: github.ref_name == github.event.repository.default_branch
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload the results to code-scanning dashboard
      id-token: write        # to publish_results and get a badge
    steps:
    - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        publish_results: true
        results_file: results.sarif
        results_format: sarif
    - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
      with:
        sarif_file: results.sarif
