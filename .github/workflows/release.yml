name: Release
on:
  push:
    tags:
      - '*'
permissions: read-all
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write # IMPORTANT: this permission is required for `rake release` to push the release tag

    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y libmagickwand-dev
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          bundler-cache: false
          ruby-version: ruby
      - run: bundle install
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b
